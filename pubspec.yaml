name: scetch
description: A private, local-first camera drawing studio.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: '>=17.0.0 <19.0.0'
  camera: '>=0.11.0 <0.13.0'
  image_picker: ^1.2.0
  image: ^4.5.4
  drift: ^2.30.0
  path_provider: ^2.1.5
  path: ^1.9.1
  crypto: ^3.0.6
  vector_math: ^2.2.0
  uuid: ^4.5.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.3
  permission_handler: ^12.0.1
  wakelock_plus: ^1.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.7.0
  drift_dev: ^2.30.0
  freezed: ^3.2.0
  json_serializable: ^6.11.0
flutter:
  uses-material-design: true
